{% extends "base.html" %}

{% block title %}404 Page Not Found | MukoLend Zimbabwe{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-16 px-4">
    <div class="max-w-md w-full text-center space-y-6 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-lg">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-bordeaux-50 text-bordeaux-800 flex items-center justify-center">
            <i data-lucide="help-circle" class="w-8 h-8"></i>
        </div>
        <div class="space-y-2">
            <h1 class="text-3xl font-extrabold text-slate-900 font-display">404 Not Found</h1>
            <p class="text-sm text-slate-600">
                The loan record, community, or page you were looking for does not exist or may have been removed.
            </p>
        </div>
        <div class="pt-4 flex items-center justify-center gap-3">
            <a href="{{ url_for('main.dashboard') }}" class="px-5 py-2.5 rounded-xl font-bold text-xs text-white bg-bordeaux-800 hover:bg-bordeaux-900 transition-colors shadow-sm">
                Go to Dashboard
            </a>
            <a href="{{ url_for('main.index') }}" class="px-4 py-2.5 rounded-xl font-semibold text-xs text-slate-600 hover:bg-slate-100 border border-slate-200 transition-colors">
                Home Page
            </a>
        </div>
    </div>
</div>
{% endblock %}
